# Run with `docker compose up --watch` (or press `w` after `up`) to enable
# file watching: source changes are synced into the containers and
# hot-reloaded by `nest --watch` / `next dev`.
services:
  store:
    build:
      context: ./store
      target: development
    environment:
      DATABASE_URL: postgresql://store:store@postgres:5432/store
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret
      PORT: 5000
      # Set these in a root .env (or the shell) to enable Stripe test payments.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        # Source changes are synced in; the Nest watcher recompiles.
        - action: sync
          path: ./store/src
          target: /app/src
        # Schema/migration changes restart the container, whose CMD
        # re-runs prisma generate + migrate deploy.
        - action: sync+restart
          path: ./store/prisma
          target: /app/prisma
        # Dependency changes need a full image rebuild.
        - action: rebuild
          path: ./store/package.json

  storefront:
    build:
      context: ./storefront
      target: development
    environment:
      # Used by next.config.ts rewrites to proxy /api/* to the backend.
      API_URL: http://store:5000
      NEXT_STRIPE_PK: ${NEXT_STRIPE_PK:-}
    ports:
      - '3000:3000'
    depends_on:
      - store
    develop:
      watch:
        - action: sync
          path: ./storefront
          target: /app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ./storefront/package.json

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store
    ports:
      # Mapped to 5433 on the host to avoid clashing with a locally
      # installed PostgreSQL on the default port.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U store -d store']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
